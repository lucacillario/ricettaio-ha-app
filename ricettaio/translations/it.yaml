configuration:
  ai_provider:
    name: Provider AI
    description: Usa openrouter (consigliato) oppure gemini per l'accesso diretto.
  openrouter_api_key:
    name: Chiave API OpenRouter
    description: Chiave dedicata OpenRouter; non viene mostrata al frontend.
  openrouter_models:
    name: Modelli OpenRouter
    description: Modelli in ordine di priorità, separati da virgola; i successivi sono fallback.
  gemini_api_key:
    name: Chiave API Gemini
    description: Chiave dedicata della Gemini Developer API; non viene mostrata al frontend.
  gemini_model:
    name: Modello Gemini
    description: Identificatore di un modello Flash stabile supportato.
  ai_enabled:
    name: Abilita AI
    description: Attiva chat e creazione assistita quando chiave e modello sono configurati.
  strict_ingress:
    name: Limita a Ingress
    description: Accetta traffico solo dal gateway Ingress di Home Assistant.
  trash_retention_days:
    name: Giorni nel cestino
    description: Giorni prima della pulizia automatica delle ricette eliminate.
