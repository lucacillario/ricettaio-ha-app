configuration:
  ai_provider:
    name: AI provider
    description: Use openrouter (recommended) or gemini for direct access.
  openrouter_api_key:
    name: OpenRouter API key
    description: Dedicated OpenRouter key; it is never exposed to the frontend.
  openrouter_models:
    name: OpenRouter models
    description: Comma-separated models in priority order; later entries are fallbacks.
  openrouter_strict_privacy:
    name: Strict OpenRouter privacy
    description: Requires Zero Data Retention and denies data collection; may exclude free models.
  gemini_api_key:
    name: Gemini API key
    description: Dedicated Gemini Developer API key; it is never exposed to the frontend.
  gemini_model:
    name: Gemini model
    description: Identifier of a supported stable Flash model.
  ai_enabled:
    name: Enable AI
    description: Enables chat and assisted creation when key and model are configured.
  strict_ingress:
    name: Restrict to Ingress
    description: Only accepts traffic from the Home Assistant Ingress gateway.
  trash_retention_days:
    name: Trash retention days
    description: Days before deleted recipes are purged automatically.
